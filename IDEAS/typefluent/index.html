<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TypeFluent – 1 Minute Typing Test</title>

<style>
#box {font-family:Arial;max-width:700px;margin:auto;background:#fff;padding:20px;border:1px solid #ddd;border-radius:10px;}
#text {font-size:18px;line-height:28px;margin-bottom:15px;background:#f7f7f7;padding:10px;border-radius:6px;}
#input {width:100%;height:120px;font-size:18px;padding:10px;border-radius:6px;border:1px solid #ccc;}
.stat {margin:10px 0;font-size:18px;}
button{padding:10px 18px;border:none;background:#4c6ef5;color:#fff;border-radius:6px;cursor:pointer;}
</style>
</head>

<body>

<div id="box">
  <h2>TypeFluent – 1 Minute Typing Test</h2>

  <div id="text">Loading passage...</div>

  <textarea id="input" placeholder="Start typing..."></textarea>

  <div class="stat">Time: <span id="time">60</span>s</div>
  <div class="stat">WPM: <span id="wpm">0</span></div>
  <div class="stat">Accuracy: <span id="acc">100</span>%</div>

  <button onclick="restart()">Restart</button>
</div>

<script type="text/javascript">
// ========== PASSAGES ==========
var passages = [
  "The quick brown fox jumps over the lazy dog. Improve your typing by practicing every day.",
  "Typing faster takes practice and patience. Focus on accuracy before speed.",
  "Daily one-minute typing tests can help you build muscle memory quickly."
];

// pick random passage
var passage = passages[Math.floor(Math.random()*passages.length)];
document.getElementById("text").innerText = passage;

// variables
var started = false;
var timeLeft = 60;
var correct = 0;
var typed = 0;

// start typing
document.getElementById("input").addEventListener("input", function(){
  if(!started){
    started = true;
    startTimer();
  }

  var val = this.value;
  typed = val.length;

  correct = 0;
  for(let i=0;i<val.length;i++){
    if(val[i] === passage[i]) correct++;
  }

  var accuracy = typed === 0 ? 100 : Math.round((correct/typed)*100);
  document.getElementById("acc").innerText = accuracy;

  var wpm = Math.round((correct/5) / ((60-timeLeft)/60 || 1));
  document.getElementById("wpm").innerText = wpm;
});

// timer function
function startTimer(){
  var timer = setInterval(function(){
    timeLeft--;
    document.getElementById("time").innerText = timeLeft;

    if(timeLeft <= 0){
      clearInterval(timer);
      document.getElementById("input").disabled = true;
    }
  }, 1000);
}

// restart
function restart(){
  location.reload();
}
</script>

</body>
</html>
