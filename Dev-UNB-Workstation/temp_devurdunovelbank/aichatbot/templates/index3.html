<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Novel Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .autocomplete { position: absolute; z-index: 10; background: white; border: 1px solid #ccc; width: 100%; border-radius: 5px; max-height: 200px; overflow-y: auto; }
        .autocomplete div { padding: 8px; cursor: pointer; }
        .autocomplete div:hover { background: #f0f0f0; }
    </style>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-lg relative">
        <h1 class="text-2xl font-bold text-center text-blue-600">Urdu Novel Search</h1>
        
        <div class="relative mt-3">
            <input type="text" id="searchQuery" placeholder="Enter novel name" 
                   class="w-full p-2 border rounded" autocomplete="off">
            <div id="suggestions" class="autocomplete hidden"></div>
        </div>

        <button onclick="searchNovel()" class="w-full mt-3 bg-blue-600 text-white p-2 rounded">Search</button>
        
        <select id="searchHistory" class="w-full mt-3 p-2 border rounded">
            <option value="">Recent Searches</option>
        </select>
        
        <ul id="results" class="mt-3"></ul>
        <button id="loadMore" class="hidden w-full bg-green-500 text-white p-2 rounded mt-3" onclick="loadMore()">Load More</button>
    </div>
    
    <script>
        let results = [];
        let page = 0;
        let perPage = 5;
        let cache = new Map();

        function searchNovel() {
            let query = document.getElementById("searchQuery").value.trim();
            if (!query) return alert("Please enter a novel name.");
            
            saveSearchHistory(query);
            if (cache.has(query)) return displayResults(cache.get(query));
            
            fetch(`/search?query=${query}`)
                .then(response => response.json())
                .then(data => {
                    cache.set(query, data);
                    results = data;
                    page = 0;
                    displayResults(data);
                })
                .catch(error => console.error("Error fetching data:", error));
        }

        function displayResults(data) {
            let resultList = document.getElementById("results");
            resultList.innerHTML = "";
            let slice = data.slice(0, perPage);
            
            slice.forEach(novel => {
                let li = document.createElement("li");
                li.classList.add("p-2", "border-b");
                li.innerHTML = `<b>${novel.title}</b> <br>
                                <button onclick="window.open('${novel.link}', '_blank')" class="bg-blue-500 text-white px-2 py-1 rounded mt-2">Download</button>`;
                resultList.appendChild(li);
            });
            document.getElementById("loadMore").classList.toggle("hidden", data.length <= perPage);
        }

        function loadMore() {
            page++;
            let start = page * perPage;
            let more = results.slice(start, start + perPage);
            let resultList = document.getElementById("results");
            
            more.forEach(novel => {
                let li = document.createElement("li");
                li.classList.add("p-2", "border-b");
                li.innerHTML = `<b>${novel.title}</b> <br>
                                <button onclick="window.open('${novel.link}', '_blank')" class="bg-blue-500 text-white px-2 py-1 rounded mt-2">Download</button>`;
                resultList.appendChild(li);
            });
            document.getElementById("loadMore").classList.toggle("hidden", start + perPage >= results.length);
        }
        
        function saveSearchHistory(query) {
            let history = JSON.parse(localStorage.getItem("searchHistory")) || [];
            if (!history.includes(query)) history.unshift(query);
            localStorage.setItem("searchHistory", JSON.stringify(history.slice(0, 5)));
            updateHistoryDropdown();
        }
        
        function updateHistoryDropdown() {
            let history = JSON.parse(localStorage.getItem("searchHistory")) || [];
            let dropdown = document.getElementById("searchHistory");
            dropdown.innerHTML = '<option value="">Recent Searches</option>';
            history.forEach(query => {
                let option = document.createElement("option");
                option.value = query;
                option.textContent = query;
                dropdown.appendChild(option);
            });
        }
        
        document.getElementById("searchHistory").addEventListener("change", function() {
            document.getElementById("searchQuery").value = this.value;
        });
        
        updateHistoryDropdown();

        // ✅ Auto-Completion Feature
        document.getElementById("searchQuery").addEventListener("input", function() {
            let query = this.value.trim();
            if (query.length < 2) return document.getElementById("suggestions").classList.add("hidden");

            fetch(`/autocomplete?query=${query}`)
                .then(response => response.json())
                .then(suggestions => {
                    let suggestionBox = document.getElementById("suggestions");
                    suggestionBox.innerHTML = "";
                    suggestionBox.classList.remove("hidden");

                    suggestions.forEach(suggestion => {
                        let div = document.createElement("div");
                        div.textContent = suggestion;
                        div.onclick = function() {
                            document.getElementById("searchQuery").value = suggestion;
                            suggestionBox.innerHTML = "";
                            suggestionBox.classList.add("hidden");
                        };
                        suggestionBox.appendChild(div);
                    });
                });
        });

        document.addEventListener("click", function(event) {
            if (!document.getElementById("searchQuery").contains(event.target)) {
                document.getElementById("suggestions").classList.add("hidden");
            }
        });
    </script>
</body>
</html>
