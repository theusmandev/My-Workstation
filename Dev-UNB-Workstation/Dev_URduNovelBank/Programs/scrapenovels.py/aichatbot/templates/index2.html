<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urdu Novel Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 transition-all duration-300">
    <div class="flex justify-center mt-10">
        <button onclick="toggleDarkMode()" class="bg-gray-800 text-white px-4 py-2 rounded">Dark Mode</button>
    </div>
    <div class="flex flex-col items-center mt-5">
        <h1 class="text-3xl font-bold text-blue-600 mb-4">Urdu Novel Search</h1>
        <div class="relative w-3/4 max-w-lg">
            <input type="text" id="searchQuery" placeholder="Enter novel name" 
                   class="w-full p-3 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            <div id="suggestions" class="absolute w-full bg-white shadow-lg rounded-md hidden"></div>
        </div>
        <button onclick="searchNovel()" class="mt-3 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Search</button>
        <div id="loading" class="hidden mt-3 text-blue-600">Loading...</div>
        <ul id="results" class="w-3/4 mt-5 bg-white shadow-md rounded-md p-4"></ul>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("bg-gray-900");
            document.body.classList.toggle("text-white");
        }

        function searchNovel() {
            let query = document.getElementById("searchQuery").value.trim();
            if (!query) {
                alert("Please enter a novel name.");
                return;
            }
            
            document.getElementById("loading").classList.remove("hidden");
            fetch(`/search?query=${query}`)
                .then(response => response.json())
                .then(data => {
                    let resultList = document.getElementById("results");
                    resultList.innerHTML = "";
                    document.getElementById("loading").classList.add("hidden");
                    
                    if (data.length === 0) {
                        resultList.innerHTML = `<li class='p-2'>No matching results found.</li>`;
                        return;
                    }
                    
                    data.forEach(novel => {
                        let li = document.createElement("li");
                        li.classList.add("p-2", "border-b");
                        li.innerHTML = `
                            <b>${novel.title}</b> <br>
                            <a href="${novel.link}" target="_blank" class="text-blue-500 underline">Download</a>
                        `;
                        resultList.appendChild(li);
                    });
                })
                .catch(error => console.error("Error fetching data:", error));
        }

        let debounceTimer;
        document.getElementById("searchQuery").addEventListener("input", function() {
            clearTimeout(debounceTimer);
            let query = this.value.trim();
            if (query.length < 2) return;
            
            debounceTimer = setTimeout(() => {
                fetch(`/autocomplete?query=${query}`)
                    .then(response => response.json())
                    .then(suggestions => {
                        let suggestionBox = document.getElementById("suggestions");
                        suggestionBox.innerHTML = "";
                        suggestionBox.classList.remove("hidden");
                        suggestions.forEach(suggestion => {
                            let div = document.createElement("div");
                            div.classList.add("p-2", "cursor-pointer", "hover:bg-gray-200");
                            div.textContent = suggestion;
                            div.onclick = function() {
                                document.getElementById("searchQuery").value = suggestion;
                                suggestionBox.innerHTML = "";
                                suggestionBox.classList.add("hidden");
                            };
                            suggestionBox.appendChild(div);
                        });
                    });
            }, 300);
        });
    </script>
</body>
</html>
