<!DOCTYPE html>
<html lang="ur">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>Advanced Urdu Transliteration System</title>
    
    <script type="text/javascript" src="https://www.google.com/jsapi"></script>
    
    <script type="text/javascript">
      // API Package load karna
      google.load("elements", "1", { packages: "transliteration" });

      var control;

      function onLoad() {
        var options = {
            sourceLanguage: google.elements.transliteration.LanguageCode.ENGLISH,
            // Multiple destination languages (Urdu, Arabic, Hindi)
            destinationLanguage: [
                google.elements.transliteration.LanguageCode.URDU,
                google.elements.transliteration.LanguageCode.ARABIC,
                google.elements.transliteration.LanguageCode.HINDI
            ],
            shortcutKey: 'ctrl+g', // Toggle karne ke liye shortcut
            transliterationEnabled: true
        };

        // Transliteration Control initialize karna
        control = new google.elements.transliteration.TransliterationControl(options);

        // Textarea ko enable karna
        control.makeTransliteratable(['transliterateTextarea']);

        // Google ka default language selection menu dikhana
        control.showControl('languageSelector');
        
        // Event Listener: Jab user language change kare
        control.addEventListener(
            google.elements.transliteration.TransliterationControl.EventType.LANGUAGE_CHANGED,
            function(e) {
                console.log("Language changed to: " + e.destinationLanguage);
            }
        );
      }

      google.setOnLoadCallback(onLoad);

      // Manual Toggle Function
      function toggleSystem() {
          control.toggleTransliteration();
      }
    </script>

    <style>
        :root { --primary-blue: #1a73e8; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; margin: 0; padding: 40px; }
        .app-card { background: white; max-width: 800px; margin: auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px; }
        .header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
        .header h1 { color: var(--primary-blue); margin: 0; font-size: 28px; }
        #languageSelector { margin-bottom: 15px; display: flex; justify-content: flex-end; }
        textarea { 
            width: 100%; height: 250px; padding: 20px; font-size: 24px; border: 1px solid #ccd0d5; 
            border-radius: 8px; direction: rtl; box-sizing: border-box; resize: none; line-height: 1.6;
        }
        .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .btn-toggle { background: var(--primary-blue); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .status-info { font-size: 14px; color: #666; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>Advanced Urdu Transliteration</h1>
        <p>Hybrid Lexicon & Rule-based Engine Interface</p>
    </div>

    <div id="languageSelector"></div>

    <textarea id="transliterateTextarea" placeholder="Yahan Roman Urdu ya English likhen... (e.g., 'kya haal hai')" spellcheck="false"></textarea>

    <div class="controls-bar">
        <div class="status-info">
            Press <b>Ctrl + G</b> to switch English/Urdu
        </div>
        <button class="btn-toggle" onclick="toggleSystem()">Toggle Engine</button>
    </div>
</div>

</body>
</html>
